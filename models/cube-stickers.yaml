# Set path to the absolute root of your labeled dataset.
path: /absolute/path/to/cube-stickers
train: images/train
val: images/val
# Default six colors. Custom colors are allowed; keep six unique names with IDs 0–5.
# Match each class ID to a face in the web app: 自定义配色 → YOLO 类别映射.
names:
  0: white
  1: red
  2: green
  3: yellow
  4: orange
  5: blue
